name: 'Release 🚀'

on:
  workflow_dispatch:

  schedule:
    # every day at 16:00
    - cron: '0 16 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Scheduled workflows only run on the default branch, so start a manual run on each release branch.
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    strategy:
      matrix:
        branch: [main, beta, 10.x]
    steps:
      - run: gh workflow run push.yml --repo ${{ github.repository }} --ref ${{ matrix.branch }}
        env:
          GH_TOKEN: ${{ github.token }}

  test:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/--test.yml
    secrets: inherit

  release:
    runs-on: ubuntu-22.04
    needs:
      - test
    steps:
      - uses: myparcelnl/actions/setup-git-credentials@v5
        id: credentials
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: myparcelnl/actions/pnpm-install@v5
        with:
          node-version: 24
          # setup-node already installs Node, so skip the one devEngines.runtime downloads.
          pnpm-args: --no-runtime

      - uses: myparcelnl/actions/semantic-release@v5
        with:
          token: ${{ secrets.GH_REPO_TOKEN }}

  rebase-prs:
    if: always() && github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - uses: myparcelnl/actions/setup-app-credentials@v5
        id: credentials
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - uses: peter-evans/rebase@v4
        with:
          token: ${{ steps.credentials.outputs.token }}
          base: ${{ github.ref_name }}
          exclude-drafts: true
