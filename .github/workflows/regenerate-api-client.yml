name: Regenerate API Client

on:
  schedule:
    - cron: '0 6 * * 1' # weekly on Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate-api-client
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: beta # @TODO: remove this ref line for `main`
          fetch-depth: 0

      # Composer install in PHP 8.3 (our image includes composer)
      - name: Install dependencies (PHP 8.3)
        run: |
          docker run --rm -t \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ghcr.io/myparcelnl/php-xd:8.3 \
            composer install --no-interaction --no-progress

      # Generate the legacy e-commerce client with the openapi-generator version from docker-compose
      # @todo INT-2034: remove this step when the e-commerce client runs on Jane
      - name: Generate legacy e-commerce client
        run: |
          docker compose --profile openapi run --rm generate-api

      # Generate the Jane clients with the Jane version that composer.json requires (PHP 8.3)
      - name: Generate Jane clients (PHP 8.3)
        run: |
          docker run --rm -t \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ghcr.io/myparcelnl/php-xd:8.3 \
            sh -c 'vendor/bin/jane-openapi generate && vendor/bin/jane-openapi generate --config-file=.jane-openapi-core'

      # Optimize autoload in PHP 8.3 (so the generated code + SDK autoload is consistent)
      - name: Dump optimized autoload (PHP 8.3)
        run: |
          docker run --rm -t \
            -v "${{ github.workspace }}:/app" \
            -w /app \
            ghcr.io/myparcelnl/php-xd:8.3 \
            composer dump-autoload -o

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Stage generated files only
        if: steps.diff.outputs.changed == 'true'
        run: |
          git reset
          git add src/Client/Generated

      - name: Setup app credentials
        if: steps.diff.outputs.changed == 'true'
        id: credentials
        uses: myparcelnl/actions/setup-app-credentials@v4
        with:
          app-id: ${{ secrets.MYPARCEL_APP_ID }}
          private-key: ${{ secrets.MYPARCEL_APP_PRIVATE_KEY }}

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ steps.credentials.outputs.token }}
          base: beta # @TODO: replace this with `main` when merging the v12 changes to that branch
          branch: beta/v12-regenerate-api-client # @TODO: replace this with `chore/regenerate-api-client` when merging the v12 changes to the main branch
          delete-branch: true
          commit-message: 'feat(api): update API clients'
          title: 'feat(api): update API clients'
          body: |
            Automated update of OpenAPI-based clients in the SDK based on changes in the MyParcel OpenAPI schemas.

            - Generated the Jane clients via `vendor/bin/jane-openapi generate`, with `.jane-openapi` and `.jane-openapi-core` (the Jane version that `composer.json` requires)
            - Generated the legacy e-commerce client via `docker compose --profile openapi run --rm generate-api` (openapi-generator version from `docker-compose.yml`)
          labels: |
            automated
            api-client
            generated
