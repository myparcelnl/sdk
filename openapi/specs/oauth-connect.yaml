openapi: 3.1.0
info:
  description: Plugin authentication through OAuth 2.0 with DPoP, the webhooks
    plugins push orders and products to, and (under webhooks) the commands
    MyParcel sends to the plugin.
  title: MyParcel OAuth Connect API
  version: 1.0.0
security:
  - dpop: []
paths:
  /connect/start:
    get:
      summary: Start the connect flow in the merchant browser
      description: Opened in the merchant browser by the plugin to start the connect
        flow. Redirects to the identity provider login.
      security: []
      parameters:
        - name: jkt
          in: query
          description: RFC 7638 thumbprint of the plugin public key. Identifies the
            installation.
          required: true
          schema:
            type: string
            minLength: 1
            examples:
              - NzbLsXh8uDCcd-6MNwXF4W_7noWXFZAfHkxZsRGC9Xs
        - name: config
          in: query
          description: Base64url-encoded JSON, see ConnectStartConfig.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 1024
            examples:
              - eyJwbGF0Zm9ybSI6IlNIT1BJRlkiLCJzaG9wTmFtZSI6Ik15IFdlYnNob3AiLCJzaG9wVXJsIjoiaHR0cHM6Ly9zaG9wLmV4YW1wbGUuY29tIiwidmVyc2lvbiI6IjEuMi4zIn0
        - name: nonce
          in: query
          description: Random value generated by the plugin, returned on the redirect back
            to the shop.
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 256
            examples:
              - nonce-0123456789abcdef
        - name: scope
          in: query
          description: Space-delimited scopes. The only supported scope is integration.
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
            examples:
              - integration
      responses:
        "302":
          description: Redirect to the identity provider login.
        "400":
          description: Invalid query parameters. HTML error page.
          content:
            text/html:
              schema:
                type: string
        "500":
          description: HTML error page.
          content:
            text/html:
              schema:
                type: string
  /connect/token:
    post:
      summary: Exchange a one-time code for an access token
      description: Redeems the one-time code from the connect flow for the first
        access token. The code is single-use.
      security: []
      parameters:
        - name: dpop
          in: header
          description: DPoP proof JWT bound to the identity provider token endpoint.
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  pattern: ^[A-Za-z0-9_-]{43}$
                  description: One-time code from the redirect back to the shop. Valid for 60
                    seconds.
                  examples:
                    - q-i7pxt49_vfkqxIel2oXjiQWOYUM2B7OyfyZUpA81c
              required:
                - code
        description: The one-time code to redeem.
        required: true
      responses:
        "200":
          description: Access token issued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                  connectionId:
                    type: string
                    format: uuid
                    pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
                    description: A Universally Unique Identifier (UUID).
                  tokenType:
                    type: string
                    const: DPoP
                  expiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  refreshExpiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  scope:
                    type: string
                    minLength: 1
                required:
                  - accessToken
                  - connectionId
                  - tokenType
                  - expiresIn
                  - refreshExpiresIn
                  - scope
        "400":
          description: invalid_code, invalid_grant, invalid_sales_channel or
            use_dpop_nonce. Problem details for a malformed request.
          headers:
            DPoP-Nonce:
              description: Present with use_dpop_nonce. Use as the nonce claim of the next
                proof.
              required: false
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: string
                        const: invalid_code
                    required:
                      - error
                  - type: object
                    properties:
                      error:
                        type: string
                        const: invalid_grant
                    required:
                      - error
                  - type: object
                    properties:
                      error:
                        type: string
                        const: invalid_sales_channel
                    required:
                      - error
                  - type: object
                    properties:
                      error:
                        type: string
                        const: use_dpop_nonce
                    required:
                      - error
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInvalidRequestSyntax"
        "401":
          description: The DPoP proof failed verification.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: invalid_dpop_proof
                required:
                  - error
        "415":
          description: Unsupported media type. Send the request body as application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsUnsupportedMediaType"
        "500":
          description: server_error. Problem details for an error outside the token
            exchange.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: server_error
                required:
                  - error
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInternalServerError"
  /connect/refresh:
    post:
      summary: Obtain a fresh access token for an established connection
      description: Issues a fresh access token for an established connection. No body,
        the DPoP proof is the credential.
      security: []
      parameters:
        - name: dpop
          in: header
          description: DPoP proof JWT bound to the identity provider token endpoint.
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Access token renewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                  tokenType:
                    type: string
                    const: DPoP
                  expiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  refreshExpiresIn:
                    type: integer
                    exclusiveMinimum: 0
                    maximum: 9007199254740991
                  scope:
                    type: string
                    minLength: 1
                required:
                  - accessToken
                  - tokenType
                  - expiresIn
                  - refreshExpiresIn
                  - scope
        "400":
          description: invalid_grant or use_dpop_nonce.
          headers:
            DPoP-Nonce:
              description: Present with use_dpop_nonce. Use as the nonce claim of the next
                proof.
              required: false
              schema:
                type: string
                minLength: 1
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      error:
                        type: string
                        const: invalid_grant
                    required:
                      - error
                  - type: object
                    properties:
                      error:
                        type: string
                        const: use_dpop_nonce
                    required:
                      - error
        "401":
          description: The DPoP proof is missing, invalid or replayed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: invalid_dpop_proof
                required:
                  - error
        "415":
          description: Unsupported media type. Send the request with Content-Type
            application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsUnsupportedMediaType"
        "500":
          description: server_error. Problem details for an error outside the refresh.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    const: server_error
                required:
                  - error
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInternalServerError"
  /webhook/orders:
    post:
      summary: Push orders from a sales channel plugin
      description: Receives orders from a connected sales channel plugin. The plugin
        calls this endpoint whenever new orders are available in the shop.
      security:
        - dpop: []
      requestBody:
        content:
          application/json:
            schema:
              minItems: 1
              maxItems: 50
              type: array
              items:
                $ref: "#/components/schemas/Order"
        description: The orders to import.
        required: true
      responses:
        "202": &ordersAccepted
          description: The request is successfully accepted. The result per item.
          content:
            application/json:
              schema:
                minItems: 1
                maxItems: 50
                type: array
                items:
                  anyOf:
                    - type: object
                      properties:
                        status:
                          type: integer
                          const: 202
                      required:
                        - status
                    - $ref: "#/components/schemas/ProblemDetailsClient"
                    - $ref: "#/components/schemas/ProblemDetailsInvalidRequestSyntax"
                    - $ref: "#/components/schemas/ProblemDetailsInternalServerError"
                $ref: "#/components/schemas/CommandResponseDeferredCreationalBody"
        # A local change, not in the spec of `mypadev/oauth-connect-library`. The service answers
        # an order push with HTTP 200, seen on acceptance on 2026-11-27. The spec says HTTP 202.
        # @todo remove this response when the service answers with HTTP 202, or when the spec of
        # the service has the 200 itself.
        "200": *ordersAccepted
        "400":
          description: Invalid request syntax
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInvalidRequestSyntax"
        "401":
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Sales channel not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsNotFound"
        "415":
          description: Unsupported media type. Send the request body as application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsUnsupportedMediaType"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInternalServerError"
  /webhook/products:
    post:
      summary: Push products from a sales channel plugin
      description: Receives products from a connected sales channel plugin. The plugin
        calls this endpoint whenever products are created or changed in the
        shop.
      security:
        - dpop: []
      requestBody:
        content:
          application/json:
            schema:
              minItems: 1
              maxItems: 50
              type: array
              items:
                $ref: "#/components/schemas/Product"
        description: The products to import.
        required: true
      responses:
        "202": &productsAccepted
          description: The request is successfully accepted. The result per item.
          content:
            application/json:
              schema:
                minItems: 1
                maxItems: 50
                type: array
                items:
                  anyOf:
                    - type: object
                      properties:
                        status:
                          type: integer
                          const: 202
                      required:
                        - status
                    - $ref: "#/components/schemas/ProblemDetailsClient"
                    - $ref: "#/components/schemas/ProblemDetailsInvalidRequestSyntax"
                    - $ref: "#/components/schemas/ProblemDetailsInternalServerError"
                $ref: "#/components/schemas/CommandResponseDeferredCreationalBody"
        # A local change, the same as for `/webhook/orders`. The product push is not tested on
        # acceptance.
        # @todo remove this response when the service answers with HTTP 202, or when the spec of
        # the service has the 200 itself.
        "200": *productsAccepted
        "400":
          description: Invalid request syntax
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInvalidRequestSyntax"
        "401":
          description: Invalid or missing credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnauthorizedResponse"
        "404":
          description: Sales channel not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsNotFound"
        "415":
          description: Unsupported media type. Send the request body as application/json.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsUnsupportedMediaType"
        "500":
          description: Internal server error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetailsInternalServerError"
webhooks:
  command:
    post:
      summary: Receive a MyParcel command (plugin endpoint)
      description: MyParcel posts every command to the commandEndpoint that the plugin
        gave at /connect/start. Run all safeguard checks before acting. Reply
        within 10 s, preferably 202, and process later.
      security:
        - myparcelSignature: []
      parameters:
        - name: Content-Digest
          in: header
          description: "RFC 9530 digest of the raw body: sha-256=:<base64>:."
          required: true
          schema:
            type: string
        - name: Signature
          in: header
          description: "RFC 9421 signature: myparcel=:<base64 r||s>:. See the
            myparcelSignature security scheme."
          required: true
          schema:
            type: string
        - name: Signature-Input
          in: header
          description: 'RFC 9421 signature parameters: one member, label "myparcel".'
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/Command"
                - oneOf:
                    - $ref: "#/components/schemas/OrderShipmentsCommand"
                  discriminator:
                    propertyName: type
                    mapping:
                      ORDER_SHIPMENTS: "#/components/schemas/OrderShipmentsCommand"
        required: true
      responses:
        "401":
          description: A safeguard check failed. MyParcel drops the command. Use 5xx when
            the plugin itself fails.
        "404":
          description: Unsupported type or unknown order. MyParcel logs a warning and
            drops the command.
        "408":
          description: Busy. MyParcel retries later.
        "429":
          description: Busy. MyParcel retries later.
        2XX:
          description: Command accepted, or a duplicate. Preferably 202. The body is
            ignored.
        3XX:
          description: Do not use. MyParcel does not follow redirects; it drops the command.
        4XX:
          description: Invalid command (400, 409, 422). MyParcel drops the command.
        5XX:
          description: Temporary failure, preferably 503. MyParcel retries later; also on
            a timeout or a network error.
components:
  schemas:
    ConnectStartConfig:
      type: object
      properties:
        platform:
          type: string
          enum:
            - CSCART
            - GENERIC
            - LIGHTSPEED
            - MAGENTO
            - PRESTA
            - SHOPIFY
            - WOOCOMMERCE
          description: Defaults to the platform of this deployment.
        shopName:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[^\p{C}]+$
          description: Display name of the shop.
        shopUrl:
          type: string
          maxLength: 128
          allOf:
            - pattern: ^https:\/\/.*
            - pattern: ^[^?#]*$
          description: HTTPS base URL of the shop. The browser returns to
            <shopUrl>/myparcel-connect/callback.
        version:
          default: 0.0.1
          description: Semver version of the plugin. Defaults to 0.0.1.
          type: string
          minLength: 1
          maxLength: 256
        commandEndpoint:
          description: Optional absolute HTTPS URL that receives every MyParcel command
            for this connection. A reconnect replaces it; without it the plugin
            gets no commands. Must be canonical (lowercase host, no default
            port, path starts with /, no user name or password); other forms are
            rejected.
          type: string
          maxLength: 250
          allOf:
            - pattern: ^https:\/\/.*
            - pattern: ^[^#]*$
      required:
        - shopName
        - shopUrl
      additionalProperties: false
      description: Decoded config query parameter of GET /connect/start.
    Money:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 three-letter currency code.
        micros:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The amount of money in integer micros.
      required:
        - currency
        - micros
      description: A monetary value represented by split integral and fractional parts
        to avoid floating point errors.
    Address:
      type: object
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 100
          description: The city of the address.
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
          pattern: "[A-Z]{2}"
          description: ISO 3166-1 alpha-2 country code.
        street:
          type: string
          minLength: 1
          maxLength: 100
          description: The street of the address.
        additionalInformation:
          description: Additional information about the address.
          type: string
          minLength: 1
          maxLength: 100
        boxNumber:
          description: The box number of the address, only applicable for specific country
            codes.
          type: string
          minLength: 1
          maxLength: 20
        houseNumber:
          description: The house number of the address.
          type: string
          minLength: 1
          maxLength: 25
        houseNumberSuffix:
          description: The house number suffix of the address.
          type: string
          minLength: 1
          maxLength: 25
        postalCode:
          description: The postal code of the address.
          type: string
          minLength: 1
          maxLength: 15
        region:
          description: The region of the address.
          type: string
          minLength: 1
          maxLength: 100
        state:
          description: The state of the address.
          type: string
          minLength: 1
          maxLength: 100
      required:
        - city
        - countryCode
        - street
      description: A physical address.
    Contact:
      oneOf:
        - type: object
          properties:
            emailAddress:
              type: string
              minLength: 1
              maxLength: 320
              description: An email address.
            locale:
              anyOf:
                - type: string
                  minLength: 5
                  maxLength: 5
                  description: Combination of ISO 639-1 and ISO 3166-1 alpha-2 separated by a
                    hyphen.
                - type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 639-1 language code.
              description: A value that is either a full locale or just a language code.
            phoneNumber:
              description: The phone number of the contact.
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              const: BUSINESS
              description: Discriminator for business contacts.
            company:
              type: string
              minLength: 1
              maxLength: 100
              description: The name of the company.
            attention:
              description: The name of the contact person.
              type: string
              minLength: 1
              maxLength: 100
          required:
            - type
            - company
        - type: object
          properties:
            emailAddress:
              type: string
              minLength: 1
              maxLength: 320
              description: An email address.
            locale:
              anyOf:
                - type: string
                  minLength: 5
                  maxLength: 5
                  description: Combination of ISO 639-1 and ISO 3166-1 alpha-2 separated by a
                    hyphen.
                - type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 639-1 language code.
              description: A value that is either a full locale or just a language code.
            phoneNumber:
              description: The phone number of the contact.
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              const: PRIVATE
              description: Discriminator for private contacts.
            name:
              type: string
              minLength: 1
              maxLength: 200
              description: The name of the contact person.
          required:
            - type
            - name
      description: A contact.
    MultiEmailContact:
      oneOf:
        - type: object
          properties:
            locale:
              anyOf:
                - type: string
                  minLength: 5
                  maxLength: 5
                  description: Combination of ISO 639-1 and ISO 3166-1 alpha-2 separated by a
                    hyphen.
                - type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 639-1 language code.
              description: A value that is either a full locale or just a language code.
            phoneNumber:
              description: The phone number of the contact.
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              const: BUSINESS
              description: Discriminator for business contacts.
            company:
              type: string
              minLength: 1
              maxLength: 100
              description: The name of the company.
            attention:
              description: The name of the contact person.
              type: string
              minLength: 1
              maxLength: 100
            emailAddresses:
              description: The email addresses of the contact. The first email address will be
                used as the primary email address. The remaining will be used as
                extra email addresses if the right permissions are present.
              minItems: 1
              maxItems: 5
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 320
                description: An email address.
          required:
            - type
            - company
        - type: object
          properties:
            locale:
              anyOf:
                - type: string
                  minLength: 5
                  maxLength: 5
                  description: Combination of ISO 639-1 and ISO 3166-1 alpha-2 separated by a
                    hyphen.
                - type: string
                  minLength: 2
                  maxLength: 2
                  description: ISO 639-1 language code.
              description: A value that is either a full locale or just a language code.
            phoneNumber:
              description: The phone number of the contact.
              type: string
              minLength: 1
              maxLength: 50
            type:
              type: string
              const: PRIVATE
              description: Discriminator for private contacts.
            name:
              type: string
              minLength: 1
              maxLength: 200
              description: The name of the contact person.
            emailAddresses:
              description: The email addresses of the contact. The first email address will be
                used as the primary email address. The remaining will be used as
                extra email addresses if the right permissions are present.
              minItems: 1
              maxItems: 5
              type: array
              items:
                type: string
                minLength: 1
                maxLength: 320
                description: An email address.
          required:
            - type
            - name
          description: A private contact that supports multiple email addresses.
      description: A contact entity capable of holding multiple email addresses.
    Carrier:
      type: string
      enum:
        - BPOST
        - BRT
        - CHEAP_CARGO
        - DHL_EUROPLUS
        - DHL_FOR_YOU
        - DHL_FREIGHT
        - DHL_PARCEL_CONNECT
        - DPD
        - GLS
        - GOFO
        - INPOST
        - INSTABEE
        - POSTNL
        - POSTE_ITALIANE
        - SPRING
        - TRUNKRS
        - UPS_EXPRESS_SAVER
        - UPS_STANDARD
        - VIA_TIM
      description: The carrier to select to ship a package with.
    BillingDetails:
      type: object
      properties:
        address:
          $ref: "#/components/schemas/Address"
        contact:
          $ref: "#/components/schemas/Contact"
      minProperties: 1
      description: Billing details of the order.
    OrderLineProduct:
      type: object
      properties:
        name:
          type: string
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: The product ID as defined in the source system.
        barcode:
          type: string
          minLength: 6
          maxLength: 24
        countryCodeOfOrigin:
          type: string
          minLength: 2
          maxLength: 2
          pattern: "[A-Z]{2}"
          description: ISO 3166-1 alpha-2 country code.
        descriptions:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: object
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 2500
                description: The text of one of the product descriptions.
              languageCode:
                type: string
                minLength: 2
                maxLength: 2
                description: The language code (ISO 639-1) of one of the product descriptions.
            required:
              - text
              - languageCode
          description: The descriptions of the product.
        ean:
          type: string
          minLength: 1
          maxLength: 13
        hsCode:
          type: string
          minLength: 6
          maxLength: 10
          description: The HS code of the product.
        physicalProperties:
          $ref: "#/components/schemas/PhysicalProperties"
        purchasePrice:
          $ref: "#/components/schemas/Money"
        salesPrice:
          $ref: "#/components/schemas/SalesPrice"
        sku:
          type: string
      required:
        - name
        - sourceId
    OrderLine:
      type: object
      properties:
        product:
          $ref: "#/components/schemas/OrderLineProduct"
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: The line ID as defined in the source system.
        price:
          $ref: "#/components/schemas/Money"
      required:
        - product
        - quantity
        - sourceId
    ShipmentOptions:
      type: object
      properties:
        additionalInsurance:
          type: object
          properties: {}
          additionalProperties: false
          description: Provides enhanced insurance coverage beyond the standard amount.
        deliverAtPostalPoint:
          type: object
          properties: {}
          additionalProperties: false
          description: Indicates that the parcel will be delivered to a designated postal
            service point rather than the recipient's address, requiring the
            recipient to collect it from that location.
        freshFood:
          type: object
          properties: {}
          additionalProperties: false
          description: Designates the shipment as containing perishable, non-frozen food
            items, ensuring appropriate handling procedures are applied to
            maintain freshness and prevent spoilage during transit.
        frozen:
          type: object
          properties: {}
          additionalProperties: false
          description: Specifies that the shipment contains items that must remain frozen,
            necessitating strict, continuous temperature-controlled environments
            throughout the transit process to prevent thawing.
        hideSender:
          type: object
          properties: {}
          additionalProperties: false
          description: Omits the sender's information from the shipping label, maintaining
            sender anonymity in the delivery process.
        insurance:
          type: object
          properties:
            amount:
              description: The amount to insure.
              $ref: "#/components/schemas/Money"
          required:
            - amount
          description: Provides standard insurance coverage up to the specified monetary
            amount.
        noTracking:
          type: object
          properties: {}
          additionalProperties: false
          description: Disables all tracking and tracing capabilities for the shipment.
        oversizedPackage:
          type: object
          properties: {}
          additionalProperties: false
          description: Designates the shipment as exceeding standard size limitations,
            requiring special handling procedures and potentially incurring
            additional fees.
        printReturnLabelAtDropOff:
          type: object
          properties: {}
          additionalProperties: false
          description: Provides the recipient with a digital identifier that can be
            presented at a drop-off location to print the return label on-site.
            This option is only applicable for inbound shipments.
        priorityDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Designates the shipment for expedited processing and transport
            through the delivery network, often resulting in a faster transit
            time compared to standard services.
        recipientOnlyDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Restricts delivery exclusively to the named recipient, requiring
            verification of recipient identity and prohibiting delivery to
            anyone else at the same address.
        requiresAgeVerification:
          type: object
          properties: {}
          additionalProperties: false
          description: Requires the recipient to provide valid identification to verify
            they meet the minimum age requirement before the package can be
            released, typically used for age-restricted items.
        requiresCashOnDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Mandates that the carrier collect the full order amount in cash
            from the recipient upon delivery, ensuring payment is secured before
            the goods are handed over.
        requiresReceiptCode:
          type: object
          properties: {}
          additionalProperties: false
          description: Requires the recipient to provide a specific verification code at
            the time of delivery, adding an extra layer of security and
            confirmation for sensitive shipments.
        requiresSignature:
          type: object
          properties: {}
          additionalProperties: false
          description: Mandates that the recipient or authorized representative must
            provide a signature upon delivery, creating proof of receipt and
            transfer of responsibility.
        returnContributionFee:
          type: object
          properties:
            amount:
              description: The amount of the contribution.
              $ref: "#/components/schemas/Money"
          required:
            - amount
          description: Specifies that the recipient must pay the designated contribution
            amount toward the cost of returning the item. This option is only
            applicable for inbound shipments.
        returnOnFirstFailedDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Instructs the carrier to return the package to the sender
            immediately after the first unsuccessful delivery attempt, bypassing
            the standard redelivery procedures or holding period.
        sameDayDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Expedited delivery within the same calendar day that the shipping
            label is created.
        saturdayDelivery:
          type: object
          properties: {}
          additionalProperties: false
          description: Enables delivery on Saturday, which is typically outside standard
            delivery days, ensuring the package arrives before the start of the
            following work week.
        scheduledCollection:
          type: object
          properties: {}
          additionalProperties: false
          description: Arranges for the carrier to pick up the package from the sender's
            location, eliminating the need for the sender to drop off the
            package.
        customLabelText:
          type: object
          properties:
            text:
              type: string
              minLength: 1
              maxLength: 45
              description: Allows adding personalized text to be printed on the shipping
                label, which can include special handling instructions or
                reference information.
          required:
            - text
          description: Defines a custom text to be printed on the shipping label.
      description: The complete set of shipment options.
      minProperties: 1
    Order:
      type: object
      properties:
        orderedAt:
          type: string
          format: date-time
          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
          description: An ISO 8601 formatted datetime string with timezone offset.
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: The order ID as defined in the source system.
        status:
          type: string
          enum:
            - OPEN
            - CANCELED
          description: The order status.
        billingDetails:
          $ref: "#/components/schemas/BillingDetails"
        customerReference:
          type: string
          minLength: 1
          maxLength: 100
          description: The customer reference of the order.
        lines:
          minItems: 1
          maxItems: 100
          type: array
          items:
            $ref: "#/components/schemas/OrderLine"
        shipping:
          type: object
          properties:
            additionalContext:
              type: string
              minLength: 1
              maxLength: 256
              description: Additional shipping context of the order.
            carrier:
              $ref: "#/components/schemas/Carrier"
            delivery:
              type: object
              properties:
                options:
                  type: object
                  properties:
                    notifyOnDelivery:
                      type: object
                      properties: {}
                      additionalProperties: false
                      description: Notify sender upon package delivery.
                    preferredDate:
                      type: object
                      properties:
                        date:
                          type: string
                          format: date
                          pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))$
                          description: Recipient specified preferred delivery date.
                      required:
                        - date
                      description: This option allows you to set a preferred date for delivery, so a
                        drop off date can be calculated.
                  description: Options regarding delivery timing and notifications.
                  minProperties: 1
                type:
                  type: string
                  enum:
                    - EARLY_MORNING_DELIVERY
                    - EVENING_DELIVERY
                    - EXPRESS_DELIVERY
                    - MORNING_DELIVERY
                    - PICKUP_EXPRESS_DELIVERY
                    - PICKUP_DELIVERY
                    - SAME_DAY_DELIVERY
                    - STANDARD_DELIVERY
                  description: The delivery type of the shipment.
              description: The delivery details of the shipment.
              minProperties: 1
            options:
              $ref: "#/components/schemas/ShipmentOptions"
            packageType:
              type: string
              enum:
                - DIGITAL_STAMP
                - ENVELOPE
                - MAILBOX
                - PACKAGE
                - PALLET
                - SMALL_PACKAGE
                - UNFRANKED
              description: The type of the package.
            pickup:
              anyOf:
                - type: object
                  properties:
                    address:
                      description: The address of the pickup location.
                      $ref: "#/components/schemas/Address"
                    location:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 200
                          description: The name of the pickup location.
                        code:
                          description: The location code of the pickup location.
                          type: string
                          minLength: 1
                          maxLength: 64
                        type:
                          type: string
                          enum:
                            - CLICK_COLLECT
                            - PARCEL_LOCKER
                            - PARCEL_POINT
                            - POST_OFFICE
                            - POST_POINT
                          description: The bpost pickup location type.
                      required:
                        - name
                        - type
                      description: The pickup location details.
                  required:
                    - address
                    - location
                  description: The bpost pickup details.
                - type: object
                  properties:
                    address:
                      description: The address of the pickup location.
                      $ref: "#/components/schemas/Address"
                    location:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 200
                          description: The name of the pickup location.
                        code:
                          description: The location code of the pickup location.
                          type: string
                          minLength: 1
                          maxLength: 64
                      required:
                        - name
                      description: The pickup location details.
                    retailNetworkId:
                      type: string
                      enum:
                        - PNPNL-01
                        - PNPBE-01
                      description: PostNL Retail network ID.
                  required:
                    - address
                    - location
                    - retailNetworkId
                  description: The PostNL pickup details.
                - type: object
                  properties:
                    address:
                      description: The address of the pickup location.
                      $ref: "#/components/schemas/Address"
                    location:
                      type: object
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 200
                          description: The name of the pickup location.
                        code:
                          description: The location code of the pickup location.
                          type: string
                          minLength: 1
                          maxLength: 64
                      required:
                        - name
                      description: The pickup location details.
                  required:
                    - address
                    - location
                  description: The general pickup details.
              description: The pickup details.
            recipient:
              type: object
              properties:
                address:
                  $ref: "#/components/schemas/Address"
                contact:
                  $ref: "#/components/schemas/MultiEmailContact"
              description: The recipient of the shipment.
              minProperties: 1
          minProperties: 1
      required:
        - orderedAt
        - sourceId
        - status
    Dimension:
      type: object
      properties:
        unit:
          type: string
          enum:
            - mm
            - cm
            - m
          description: The unit of measurement for length, width, or height.
        value:
          type: integer
          minimum: 1
          maximum: 1000000
          description: The dimension value.
      required:
        - unit
        - value
      description: The physical dimension.
    PhysicalProperties:
      type: object
      properties:
        height:
          description: The height.
          $ref: "#/components/schemas/Dimension"
        length:
          description: The length.
          $ref: "#/components/schemas/Dimension"
        weight:
          description: The weight.
          type: object
          properties:
            unit:
              type: string
              enum:
                - g
                - kg
              description: The unit of weight.
            value:
              type: integer
              minimum: 1
              maximum: 999999999
          required:
            - unit
            - value
        width:
          description: The width.
          $ref: "#/components/schemas/Dimension"
      description: The physical dimensions.
      minProperties: 1
    SalesPrice:
      type: object
      properties:
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO 4217 three-letter currency code.
        micros:
          type: integer
          minimum: 0
          maximum: 9007199254740991
          description: The amount of money in integer micros.
        taxRate:
          type: integer
          minimum: 0
          maximum: 100
      required:
        - currency
        - micros
        - taxRate
      description: A monetary value represented by split integral and fractional parts
        to avoid floating point errors.
    ProductChild:
      type: object
      properties:
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: The ID of the child product as defined in the source system.
      required:
        - quantity
        - sourceId
    Product:
      type: object
      properties:
        name:
          type: string
        sourceId:
          type: string
          minLength: 1
          maxLength: 50
          description: The product ID as defined in the source system.
        trackInventory:
          type: boolean
          description: Whether the shop tracks the stock of this product.
        barcode:
          type: string
          minLength: 6
          maxLength: 24
        children:
          description: The parts of a bundle product, identified by their own source ID.
          minItems: 1
          maxItems: 50
          type: array
          items:
            $ref: "#/components/schemas/ProductChild"
        containsDangerousSubstances:
          type: boolean
        countryCodeOfOrigin:
          type: string
          minLength: 2
          maxLength: 2
          pattern: "[A-Z]{2}"
          description: ISO 3166-1 alpha-2 country code.
        descriptions:
          minItems: 1
          maxItems: 200
          type: array
          items:
            type: object
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 2500
                description: The text of one of the product descriptions.
              languageCode:
                type: string
                minLength: 2
                maxLength: 2
                description: The language code (ISO 639-1) of one of the product descriptions.
            required:
              - text
              - languageCode
          description: The descriptions of the product.
        ean:
          type: string
          minLength: 1
          maxLength: 13
        hasUnlimitedShelfLife:
          type: boolean
        hsCode:
          type: string
          minLength: 6
          maxLength: 10
          description: The HS code of the product.
        physicalProperties:
          $ref: "#/components/schemas/PhysicalProperties"
        purchasePrice:
          $ref: "#/components/schemas/Money"
        salesPrice:
          $ref: "#/components/schemas/SalesPrice"
        sku:
          type: string
      required:
        - name
        - sourceId
        - trackInventory
    Command:
      type: object
      properties:
        commandId:
          type: string
          minLength: 1
          description: Identifies one command. An opaque string; do not parse it. The same
            value on every resend. Drop duplicates per (connectionId, commandId)
            for at least 14 days; it is also the replay protection.
        connectionId:
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
          description: Must equal the connection id from /connect/token. Changes on
            reconnect.
        type:
          type: string
          description: The command name. Reply 404 to a name the plugin does not know.
      required:
        - commandId
        - connectionId
        - type
      discriminator:
        propertyName: type
        mapping:
          ORDER_SHIPMENTS: "#/components/schemas/OrderShipmentsCommand"
    OrderShipmentsCommand:
      allOf:
        - $ref: "#/components/schemas/Command"
        - type: object
          properties:
            type:
              type: string
              const: ORDER_SHIPMENTS
              description: The command name.
            order:
              $ref: "#/components/schemas/OrderShipmentsOrder"
            shipment:
              $ref: "#/components/schemas/OrderShipmentsShipment"
          required:
            - type
            - order
            - shipment
      description: Order lines of an order are shipped. One command holds one shipment.
    OrderShipmentsOrder:
      type: object
      properties:
        sourceId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - PARTIALLY_SHIPPED
            - SHIPPED
      required:
        - sourceId
        - status
    OrderShipmentsShipment:
      type: object
      properties:
        orderLines:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/OrderShipmentsOrderLine"
        shipmentId:
          type: string
          minLength: 1
      required:
        - orderLines
        - shipmentId
    OrderShipmentsOrderLine:
      type: object
      properties:
        quantity:
          type: integer
          exclusiveMinimum: 0
          maximum: 9007199254740991
        sourceId:
          type: string
          minLength: 1
      required:
        - quantity
        - sourceId
