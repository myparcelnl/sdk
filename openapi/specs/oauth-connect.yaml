  securitySchemes:
    apiKey:
      type: apiKey
      name: Authorization
      in: header
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    dpop:
      description: "Access token as Authorization: DPoP <token>, plus a DPoP proof
        header per request."
      scheme: dpop
      type: http
    myparcelSignature:
      description: RFC 9421 HTTP message signature by MyParcel. Signature-Input and
        Signature have one member, label "myparcel"; components ("@method"
        "@target-uri" "content-type" "content-digest"), created, expires
        (created + 60), keyid (a kid in /.well-known/jwks.json) and alg
        "ecdsa-p256-sha256". Use the stored commandEndpoint as @target-uri.
        Content-Digest is the RFC 9530 sha-256 of the raw body.
      in: header
      name: Signature
      type: apiKey
