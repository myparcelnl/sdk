'!include': 'common.yaml'

# OpenAPI Generator configuration
inputSpec: https://api.myparcel.nl/openapi.min.json
outputDir: src/Client/Generated/CoreApi
# Maps inline schema names to shorter, cleaner class names
inlineSchemaNameMappings:
  # Capabilities V2 - used in CapabilitiesMapper
  capabilities_post_capabilities_request_v2_recipient: CapabilitiesRecipientV2
  capabilities_post_capabilities_request_v2_sender: CapabilitiesSenderV2
  capabilities_post_capabilities_request_v2_options: CapabilitiesOptionsV2
  capabilities_post_capabilities_request_v2_physicalProperties: CapabilitiesPhysicalPropertiesV2
  capabilities_post_capabilities_request_v2_physicalProperties_height: PhysicalPropertiesHeightV2
  capabilities_post_capabilities_request_v2_physicalProperties_length: PhysicalPropertiesLengthV2
  capabilities_post_capabilities_request_v2_physicalProperties_width: PhysicalPropertiesWidthV2
  capabilities_post_capabilities_request_v2_physicalProperties_weight: PhysicalPropertiesWeightV2

  # Shipment V1.1 - test mappings
  shipment_post_shipments_request_v1_1_data_shipments_inner: ShipmentRequest
  shipment_post_shipments_request_v1_1_data_shipments_inner_secondary_shipments_inner: SecondaryShipmentRequest
typeMappings:
  # Map Empty model classes (oneOf) to primitives to avoid generating empty classes
  RefTypesMoneyAmount: int
  RefTypesMoneyPropertiesAmount: int

  # @todo remove when upstream spec fixes the street pattern.
  # Redirects to an override class that fixes the broken setStreet() regex (missing
  # regex delimiters). The email pseudo-enum bug is handled generically by the
  # value-less-enum guards in the ObjectSerializer/model templates.
  ShipmentDefsShipmentRecipient: FixedShipmentRecipient
  # @todo remove when upstream spec fixes reference_identifier union type
  # The union ['null','integer','string'] generates an empty wrapper model that loses data.
  RefShipmentReferenceIdentifier: string
  # @todo remove when upstream spec/codegen fixes link_consumer_portal oneOf(uri | empty-string)
  # The current codegen produces empty wrapper models that lose the actual URL.
  ShipmentDefsShipmentPropertiesLinkConsumerPortal: string
  # @todo remove when upstream spec/codegen fixes region oneOf(string pattern | enum)
  # The current codegen produces unusable model wrappers/enums for shipment resource regions.
  ShipmentDefsShipmentPropertiesRegion: string
  # @todo remove when upstream spec fixes return shipment payment_status empty-string responses
  # Live return-shipment responses currently return "", which violates the enum and breaks deserialization.
  ShipmentDefsShipmentPaymentStatus: string
  # @todo remove when the generator represents type: ["string", "integer"] as a scalar
  # Generator 7.26.0 turns the collection contact number and the request reference_identifier
  # into empty wrapper models. Both keep the type they had in v11.
  ShipmentPostShipmentsRequestV11DataShipmentsInnerCollectionContactNumber: string
  ShipmentPostShipmentsRequestV11DataShipmentsInnerReferenceIdentifier: int
  # @todo remove when the generator resolves oneOf(null | $ref) on SecondaryShipmentResource
  # Generator 7.26.0 makes empty wrapper models here, which drop the value on deserialization.
  ShipmentDefsShipmentPropertiesCurrency: BillingDefsCurrency
  ShipmentDefsShipmentPropertiesExternalProvider: ShipmentDefsExternalProviderPropertiesDisplayName
  # @todo remove when the generator keeps the allOf members of an inline insurance schema
  # Generator 7.26.0 makes a model with only a mixed amount, which drops the currency.
  RefShipmentOptionsInsuranceMaxAllOfInsurance: RefTypesPriceEuro
additionalProperties:
  '!include': 'commonProperties.yaml'
  packageName: MyParcelNL\Sdk\Client\Generated\CoreApi
  invokerPackage: MyParcelNL\Sdk\Client\Generated\CoreApi
