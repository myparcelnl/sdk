'!include': 'common.yaml'

# OpenAPI Generator configuration
# The e-commerce service spec: the connect endpoints and the webhooks in one document. The copy
# comes from docs/api/openapi.yaml in mypadev/oauth-connect-library, updated by hand. After each
# update, change every `status: type: number` to `type: integer`: a number generates a PHP float,
# and the strict enum check then refuses 400.0 against 400.
# @todo replace inputSpec once the OFF team decides how the spec is published (public URL or
# internal repo), and drop the status fix once the spec uses integer.
inputSpec: /local/openapi/specs/oauth-connect.yaml
outputDir: src/Client/Generated/EcommerceApi
typeMappings:
  # @todo remove when the generator can represent the /webhook/orders 202 oneOf.
  # It flattens the three branches into one model whose validation no accepted item can pass.
  WebhookOrdersPost202ResponseInner: FixedWebhookOrderResult
# @todo remove in v12, when the SDK supports webhooks. These schemas are used only by the command
# webhook under webhooks:, so they are mapped away and not generated.
schemaMappings:
  Command: Command
  CommandEnvelope: CommandEnvelope
  OrderShipmentsCommand: OrderShipmentsCommand
  OrderShipmentsOrder: OrderShipmentsOrder
  OrderShipmentsOrderLine: OrderShipmentsOrderLine
  OrderShipmentsShipment: OrderShipmentsShipment
# Lists apis, models and supportingFiles so the generator leaves out webhooks: with webhooks on,
# 7.12.0 overwrites Api/DefaultApi.php with the webhook (openapi-generator#20346). This block
# replaces the one in common.yaml, so it repeats apiTests and modelTests.
globalProperties:
  apiTests: false
  modelTests: false
  apis: ''
  models: ''
  supportingFiles: ''
additionalProperties:
  '!include': 'commonProperties.yaml'
  packageName: MyParcelNL\Sdk\Client\Generated\EcommerceApi
  invokerPackage: MyParcelNL\Sdk\Client\Generated\EcommerceApi
